name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref so frequent pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ruff lint. Its own job so a style failure never hides the test result.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/crawler-py/pyproject.toml
            packages/cli/pyproject.toml
      - name: Install ruff
        run: pip install -e "packages/crawler-py[dev]"
      - name: Ruff
        run: ruff check packages/crawler-py/shroodler packages/crawler-py/tests packages/cli

  # Fast feedback: the Python unit suite. No Docker, no Chromium download, no
  # Go build — so this stays a few minutes even on a cold cache.
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/crawler-py/pyproject.toml
            packages/cli/pyproject.toml
            packages/guardrails/pyproject.toml
            packages/mcp-server/pyproject.toml
      - name: Install packages (editable)
        run: |
          python -m pip install --upgrade pip
          pip install \
            -e packages/crawler-py[dev] \
            -e packages/cli \
            -e packages/guardrails \
            -e packages/mcp-server
      - name: Unit tests
        run: |
          pytest packages/crawler-py/tests/unit -q
          pytest packages/secret-patterns/tests -q
          pytest packages/report-generator/tests -q
          PYTHONPATH=packages/payload-tester pytest packages/payload-tester/tests -q
          pytest packages/cli/tests -q
          pytest packages/guardrails/tests -q
          pytest packages/mcp-server/tests -q

  # Go build + unit tests + gofmt. Independent of the Python jobs.
  go-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            packages/crawler-go/go.sum
            packages/proxy-go/go.sum
      - name: gofmt
        run: cd packages/crawler-go && gofmt -l . | { ! grep .; }
      - name: Build
        run: |
          cd packages/crawler-go && go build ./...
          cd ../proxy-go && go build ./...
      - name: Test
        run: |
          cd packages/crawler-go && go test ./...
          cd ../proxy-go && go test ./...

  # Integration tests (make test-integration) are intentionally NOT run here.
  # They need Docker services and the private `packages/target-apps` submodule
  # (github.com/Fantastic-Fanta/Shroodler-Tests), which a default runner cannot
  # clone. To enable: add a repo secret with a PAT/deploy key that can read that
  # repo, then add a job that checks out with
  #   - uses: actions/checkout@v4
  #     with: { submodules: recursive, token: ${{ secrets.SUBMODULE_TOKEN }} }
  # and runs `make bootstrap bins test-integration`.
