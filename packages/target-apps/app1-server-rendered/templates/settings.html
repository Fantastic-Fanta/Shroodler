{% extends "base.html" %}
{% block title %}Settings — App1{% endblock %}
{% block content %}
<h1>Settings</h1>
<form action="/settings" method="POST" enctype="application/x-www-form-urlencoded">
  <label>Display name <input type="text" name="display_name"></label>
  <label>New password <input type="password" name="new_password" autocomplete="on"></label>
  <label>Notify <input type="checkbox" name="notify" value="1"></label>
  <label>Role
    <select name="role">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>
  </label>
  <textarea name="bio"></textarea>
  <input type="file" name="avatar">
  <input type="text" name="legacy_id" disabled>
  <input type="text" name="tenant" readonly value="app1">
  <button type="submit">Save</button>
</form>
{% endblock %}
