name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref so frequent pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: lint + the Python unit suite. No Docker, no Chromium
  # download, no Go build — so this stays a few minutes even on cold cache.
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/crawler-py/pyproject.toml
            packages/cli/pyproject.toml
            packages/guardrails/pyproject.toml
            packages/mcp-server/pyproject.toml
      - name: Install packages (editable)
        run: |
          python -m pip install --upgrade pip
          pip install \
            -e packages/crawler-py[dev] \
            -e packages/cli \
            -e packages/guardrails \
            -e packages/mcp-server
      - name: Lint (ruff)
        run: ruff check packages/crawler-py/shroodler packages/crawler-py/tests packages/cli
      - name: Unit tests
        run: |
          pytest packages/crawler-py/tests/unit -q
          pytest packages/secret-patterns/tests -q
          pytest packages/report-generator/tests -q
          PYTHONPATH=packages/payload-tester pytest packages/payload-tester/tests -q

  # Go build + unit tests + gofmt. Fast and independent of the Python job.
  go-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            packages/crawler-go/go.sum
            packages/proxy-go/go.sum
      - name: gofmt
        run: cd packages/crawler-go && gofmt -l . | { ! grep .; }
      - name: Build
        run: |
          cd packages/crawler-go && go build ./...
          cd ../proxy-go && go build ./...
      - name: Test
        run: |
          cd packages/crawler-go && go test ./...
          cd ../proxy-go && go test ./...

  # Heavier: Docker services + Playwright browser + Go binaries. Slower and
  # more likely to be flaky, so it runs as its own job — a failure here does
  # not hide the fast unit signal above.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/crawler-py/pyproject.toml
            packages/cli/pyproject.toml
            packages/guardrails/pyproject.toml
            packages/mcp-server/pyproject.toml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Bootstrap (deps, Chromium, Go binaries)
        run: make bootstrap bins
      - name: Integration tests
        run: make test-integration
