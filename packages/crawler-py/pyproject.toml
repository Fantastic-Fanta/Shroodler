[project]
name = "shroodler"
version = "0.1.0"
description = "Shroodler Python crawler"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shroodler = "shroodler.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shroodler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
