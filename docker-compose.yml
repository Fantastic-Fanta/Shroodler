services:
  app1:
    build: ./packages/target-apps/app1-server-rendered
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      shroodler:
        aliases:
          - app1.local

  app2:
    build: ./packages/target-apps/app2-spa
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      shroodler:
        aliases:
          - app2.local

  app3:
    build: ./packages/target-apps/app3-crawler-traps
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      shroodler:
        aliases:
          - app3.local

  app4:
    build: ./packages/target-apps/app4-microservices
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      shroodler:
        aliases:
          - app4.local

networks:
  shroodler:
    driver: bridge
