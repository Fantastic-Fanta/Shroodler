[project]
name = "shroodler-cli"
version = "0.1.0"
description = "Shroodler command-line interface"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shroodler = "shroodler_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shroodler_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
