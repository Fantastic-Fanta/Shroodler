[project]
name = "shroodler-cli"
version = "0.2.0"
description = "Web attack-surface mapping CLI (Shroodler) -- crawl, report, diff baselines, payload-test, and drive the intercepting proxy from one command"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The Shroodler Authors" }]
keywords = ["security", "pentest", "appsec", "crawler", "web-security", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
# This package is a thin, friendly-named wrapper around the "shroodler"
# package (packages/crawler-py), which holds the actual crawler/CLI
# implementation and its own "shroodler" console script. Installing both
# together (as `make bootstrap` does) is intentional -- this one is the
# name meant for `pip install shroodler-cli` from a registry.
dependencies = ["shroodler"]

[project.scripts]
shroodler = "shroodler_cli.main:main"

[project.urls]
Homepage = "https://github.com/Fantastic-Fanta/Shroodler"
Repository = "https://github.com/Fantastic-Fanta/Shroodler"
Changelog = "https://github.com/Fantastic-Fanta/Shroodler/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shroodler_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# importlib import mode avoids sys.modules name collisions when this
# package's tests are collected in the same pytest invocation as another
# package's identically-named test file (e.g. both cli/tests/test_cli.py
# and crawler-py/tests/unit/test_cli.py) -- rootdir-relative import mode
# would otherwise register both under the same "test_cli" module name.
addopts = "--import-mode=importlib"
