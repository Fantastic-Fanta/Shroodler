[project]
name = "shroodler"
version = "0.2.0"
description = "Web attack-surface mapping crawler: passive checks, active payload testing, and CI baseline gating for apps you're authorized to test"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The Shroodler Authors" }]
keywords = ["security", "pentest", "appsec", "crawler", "web-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.6",
  "jsonschema>=4.22",
  "PyYAML>=6.0",
  "playwright>=1.45",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.6", "pytest-cov>=5.0"]

[project.scripts]
shroodler = "shroodler.cli:main"

[project.urls]
Homepage = "https://github.com/Fantastic-Fanta/Shroodler"
Repository = "https://github.com/Fantastic-Fanta/Shroodler"
Changelog = "https://github.com/Fantastic-Fanta/Shroodler/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shroodler*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
# importlib import mode avoids sys.modules name collisions when this
# package's tests are collected in the same pytest invocation as another
# package's identically-named test file (e.g. both cli/tests/test_cli.py
# and crawler-py/tests/unit/test_cli.py) -- rootdir-relative import mode
# would otherwise register both under the same "test_cli" module name.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP017"]
