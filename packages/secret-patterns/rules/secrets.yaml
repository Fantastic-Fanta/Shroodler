- id: aws-access-key
  pattern: 'AKIA[0-9A-Z]{16}'
  severity: high
  description: AWS Access Key ID
- id: aws-secret-key
  pattern: '(?i)(?:aws_?secret_?access_?key|secret_?access_?key)\s*[:=]\s*["'']?([A-Za-z0-9/+=]{40})'
  severity: high
  description: AWS Secret Access Key
- id: generic-jwt
  pattern: 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'
  severity: low
  description: >-
    JWT-looking token. Many client-side ID/access tokens are expected to be
    visible to the browser and are not a secret by themselves -- decode the
    payload and check for sensitive claims, a missing/weak signature
    algorithm ("alg":"none"), or an unexpectedly long expiry before treating
    this as a real finding.
- id: private-key-block
  pattern: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
  severity: critical
  description: Private key block
- id: slack-token
  pattern: 'xox[baprs]-[0-9A-Za-z-]{10,}'
  severity: high
  description: Slack token
- id: generic-api-key
  pattern: '__ENTROPY__'
  severity: medium
  description: High-entropy string that may be an API key
- id: basic-auth-url
  pattern: 'https?://[^/\s:''"]+:[^/\s@''"]+@'
  severity: high
  description: Basic auth credentials in a URL
- id: database-connection-string
  pattern: '(?i)(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|mssql|mariadb)://[^\s''"]+'
  severity: high
  description: Database connection string
