[project]
name = "shroodler-guardrails"
version = "0.1.0"
description = "Consent-manifest scope verification and safety guardrails (rate limits, audit log) for agentic active-payload testing"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The Shroodler Authors" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shroodler_guardrails*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
